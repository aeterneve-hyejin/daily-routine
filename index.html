<style>
/* Layout: one Notion-style page column; each routine step is a toggle block, the open one is today's "now". */
:root{
  --bg:#ffffff; --fg:#37352f; --muted:#8a8883; --line:#ebeae6; --soft:#f7f6f3; --hover:#efeeea;
  --hl-yellow:#fbf3db; --hl-blue:#e7f1f8; --hl-green:#edf3ec; --hl-pink:#faeef3; --hl-purple:#f2eef9;
  --accent:#2a7fd4; --ok:#3f8a5c; --warn:#c4554d;
  --heat0:#efeeea; --heat1:#d6ead8; --heat2:#a9d3b0; --heat3:#6fb281; --heat4:#3f8a5c;
  --paper:#fffdf6; --paper-line:#e6e1d3; --ink:#2b2a27;
  --hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --fg:#e7e5e1; --muted:#9a9893; --line:#2e2e2c; --soft:#212120; --hover:#2a2a28;
  --hl-yellow:#3a3322; --hl-blue:#1f2e3a; --hl-green:#22302a; --hl-pink:#3a2430; --hl-purple:#2c2638;
  --accent:#5aa6ee; --ok:#6cc08a; --warn:#e07a72;
  --heat0:#2a2a28; --heat1:#24402e; --heat2:#2f5c3e; --heat3:#47875c; --heat4:#6cc08a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --fg:#e7e5e1; --muted:#9a9893; --line:#2e2e2c; --soft:#212120; --hover:#2a2a28;
  --hl-yellow:#3a3322; --hl-blue:#1f2e3a; --hl-green:#22302a; --hl-pink:#3a2430; --hl-purple:#2c2638;
  --accent:#5aa6ee; --ok:#6cc08a; --warn:#e07a72;
  --heat0:#2a2a28; --heat1:#24402e; --heat2:#2f5c3e; --heat3:#47875c; --heat4:#6cc08a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.page{max-width:820px;margin:0 auto;padding:40px 20px 80px}
.hand{font-family:var(--hand)}
.cover-emoji{font-size:64px;line-height:1}
h1{font-family:var(--hand);font-weight:700;font-size:46px;line-height:1.1;margin:10px 0 4px;text-wrap:balance}
.date{color:var(--muted);font-size:15px}
.props{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:20px 0 8px;font-size:15px;align-items:center}
.props dt{color:var(--muted);white-space:nowrap}
.props dd{margin:0;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:6px;padding:1px 8px;font-size:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1;min-width:120px;max-width:260px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
h2{font-family:var(--hand);font-weight:700;font-size:30px;margin:30px 0 8px;display:flex;align-items:center;gap:8px}
h2 small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--hl-yellow);margin:8px 0}
.callout.blue{background:var(--hl-blue)}.callout.green{background:var(--hl-green)}.callout.pink{background:var(--hl-pink)}.callout.purple{background:var(--hl-purple)}
.callout .ic{font-size:22px;line-height:1.3}
.callout>div{min-width:0}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:background .15s}
button:hover,.btn:hover{background:var(--hover)}
button:focus-visible,.btn:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--warn)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{display:flex;flex-direction:column;gap:2px}
.step{border-radius:var(--r)}
.step.open{background:var(--soft)}
.step-head{display:flex;align-items:center;gap:12px;padding:8px 10px;min-height:52px;border-radius:var(--r);cursor:pointer;user-select:none}
.step:not(.open) .step-head:hover{background:var(--soft)}
.chk{flex:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;background:var(--bg);padding:0;min-height:0}
.chk svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:.2s}
.step.done .chk{background:var(--ok);border-color:var(--ok)}
.step.done .chk svg{opacity:1;transform:none}
.step-emoji{font-size:24px;width:30px;text-align:center}
.step-title{font-family:var(--hand);font-size:25px;font-weight:700;flex:1;min-width:0;line-height:1.2}
.step.done .step-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ok)}
.step-meta{color:var(--muted);font-size:14px;white-space:nowrap}
.chev{color:var(--muted);transition:transform .2s;font-size:13px}
.step.open .chev{transform:rotate(90deg)}
.step-body{padding:2px 14px 18px 62px;display:flex;flex-direction:column;gap:12px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.clock{font-family:var(--hand);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;min-width:5ch}
.clock.run{color:var(--accent)}
.label{font-size:13px;color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
input[type=text],input[type=url],input[type=time],input[type=number],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;width:100%}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:99px;padding:8px 16px}
.chip[aria-pressed="true"]{background:var(--hl-blue);border-color:var(--accent);color:var(--fg);font-weight:700}
.goal-text{font-family:var(--hand);font-size:28px;line-height:1.3;font-weight:700}
.memo-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.memo-tools .tool[aria-pressed="true"]{background:var(--hl-yellow);border-color:var(--fg)}
.swatch{width:30px;height:30px;min-height:0;border-radius:50%;padding:0;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.paper{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 35px,var(--paper-line) 35px 36px);}
.paper canvas{display:block;width:100%;height:380px;touch-action:none}
.paper .hint{position:absolute;left:16px;top:8px;font-family:var(--hand);color:#b4ad9b;font-size:20px;pointer-events:none}
.paper img{display:block;width:100%}
.save-state{font-size:13px;color:var(--muted);margin-left:auto}
.sessions{display:flex;flex-wrap:wrap;gap:6px}
.focus-bar{display:flex;align-items:center;gap:12px}
.focus-bar .bar{max-width:none;height:12px}
.focus-num{font-family:var(--hand);font-size:24px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,40px));gap:6px}
.heat .dow{font-size:12px;color:var(--muted);text-align:center}
.heat .c{aspect-ratio:1;border-radius:7px;background:var(--heat0);display:grid;place-items:center;font-size:11px;color:var(--muted);max-width:100%}
.heat .c.l1{background:var(--heat1)}.heat .c.l2{background:var(--heat2)}.heat .c.l3{background:var(--heat3);color:#fff}.heat .c.l4{background:var(--heat4);color:#fff}
.heat .c.today{outline:2px solid var(--fg);outline-offset:1px}
.heat .c.empty{background:transparent}
.stats{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
details.settings{border-top:1px solid var(--line);margin-top:34px;padding-top:10px}
details.settings summary{cursor:pointer;font-family:var(--hand);font-size:26px;font-weight:700;list-style:none;padding:6px 0}
details.settings summary::-webkit-details-marker{display:none}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.set-grid .full{grid-column:1/-1}
.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-family:var(--hand);font-size:22px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:600px){
  .page{padding:24px 16px 60px}
  h1{font-size:38px}
  .step-body{padding:2px 10px 16px 12px}
  .fields,.set-grid{grid-template-columns:1fr}
  .clock{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="page">
  <div class="cover-emoji" aria-hidden="true">🌱</div>
  <h1>하루 루틴 노트</h1>
  <div class="date" id="dateLine"></div>
  <dl class="props" id="props"></dl>
  <hr>
  <div id="main"></div>
  <h2>📅 기록 <small>최근 5주</small></h2>
  <div class="stats" id="stats"></div>
  <details class="settings" id="settingsBox">
    <summary>⚙️ 설정</summary>
    <div class="set-grid">
      <div class="full callout blue" style="margin:0"><span class="ic">⚡</span><div>버튼을 누르면 <b>단축어 앱</b>에 만든 단축어가 실행돼요. 단축어 앱의 이름과 <b>띄어쓰기까지 똑같이</b> 적어주세요.</div></div>
      <label><div class="label">🎬 드림보드 · ☀️ 아침</div><input type="text" id="s-dreamAmSc" data-set="dreamAmSc"></label>
      <label><div class="label">🎬 드림보드 · 🌤 점심</div><input type="text" id="s-dreamNoonSc" data-set="dreamNoonSc"></label>
      <label><div class="label">🎬 드림보드 · 🌙 저녁</div><input type="text" id="s-dreamEveSc" data-set="dreamEveSc"></label>
      <label><div class="label">📔 꼬박일기</div><input type="text" id="s-diarySc" data-set="diarySc"></label>
      <label><div class="label">📱 YES24</div><input type="text" id="s-yes24Sc" data-set="yes24Sc"></label>
      <label class="full"><div class="label">✍️ 나의 목표 문장 (100번 쓰기)</div><input type="text" id="s-goalText" data-set="goalText" placeholder="예: 나는 2027년까지 ○○을 이룬다"></label>
      <label><div class="label">⏰ 기상 목표 시간</div><input type="time" id="s-wake" data-set="wake"></label>
      <label><div class="label">🎯 하루 집중 목표 (분)</div><input type="number" id="s-focusGoal" data-set="focusGoal" min="30" max="480" step="10"></label>
      <label class="full"><div class="label">▶️ 명상 영상 링크 (유튜브)</div><input type="url" id="s-meditateUrl" data-set="meditateUrl"></label>
      <label><div class="label">🧘 명상 (분)</div><input type="number" id="s-meditateMin" data-set="meditateMin" min="1" max="120"></label>
      <label><div class="label">🏃 운동 최소 (분)</div><input type="number" id="s-stretchMin" data-set="stretchMin" min="1" max="120"></label>
      <label><div class="label">📚 독서 (분)</div><input type="number" id="s-readMin" data-set="readMin" min="1" max="240"></label>
      <div class="full muted" id="syncNote"></div>
      <div class="full row"><button class="btn" type="button" id="exportBtn">💾 백업 파일 저장</button><label class="btn" for="importFile">📥 백업 불러오기</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    </div>
  </details>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=t=>{const d=new Date(t);return `${d.getHours()}:${pad(d.getMinutes())}`};
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const STEPS=[
  {id:"video",sec:"am",emoji:"🎬",title:"드림보드 루틴(아침)"},
  {id:"diary",sec:"am",emoji:"📔",title:"꼬박일기 쓰기"},
  {id:"goal",sec:"am",emoji:"✍️",title:"나의 목표 100번 쓰기"},
  {id:"meditate",sec:"am",emoji:"🧘",title:"명상",minKey:"meditateMin"},
  {id:"stretch",sec:"am",emoji:"🏃",title:"운동",minKey:"stretchMin",suffix:"이상"},
  {id:"read",sec:"am",emoji:"📚",title:"독서",minKey:"readMin"},
  {id:"dream_noon",sec:"noon",emoji:"🎬",title:"드림보드 루틴(점심)"},
  {id:"focus",sec:"work",emoji:"🎯",title:"딥포커스 집중 시간"},
  {id:"dream_eve",sec:"eve",emoji:"🎬",title:"드림보드 루틴(저녁)"},
];
const AM=STEPS.filter(s=>s.sec==="am").map(s=>s.id);
const DEFAULT_SET={dreamAmSc:"드림보드 아침",dreamNoonSc:"드림보드 점심",dreamEveSc:"드림보드 저녁",diarySc:"꼬박일기",yes24Sc:"YES24",goalText:"",wake:"09:00",focusGoal:120,meditateMin:5,stretchMin:30,readMin:30,meditateUrl:"https://www.youtube.com/watch?v=dZewQEbQQM0&list=PLKg3-fgaBbdvAZpxLAJwLwYQ821dXIY8-&index=2",v:4,updatedAt:0};
const scBtn=(name,label,cls="btn")=>name?`<a class="${cls}" href="shortcuts://run-shortcut?name=${encodeURIComponent(name)}">${label}</a>`:`<button class="btn" data-act="openSettings">⚡ 단축어 이름 넣기</button>`;
/* v2: 명상 5분 + 명상 영상 링크 (이전 설정에도 한 번 적용) */
function migrate(){const v=S.v||0;if(v>=4)return;if(v<2){S.meditateMin=5;S.meditateUrl=S.meditateUrl||DEFAULT_SET.meditateUrl}if(v<3)S.stretchMin=Math.max(30,Number(S.stretchMin)||0);["dreamAmSc","dreamNoonSc","dreamEveSc","diarySc","yes24Sc"].forEach(k=>{if(!S[k])S[k]=DEFAULT_SET[k]});S.v=4;if(S.updatedAt)saveSettings()}
const newDay=date=>({date,done:{},wakeAt:null,read:{mode:null,title:"",progress:""},focus:{task:"",minutes:0,sessions:[]},timer:null,updatedAt:0});

/* ---------- storage: browser copy first, private cloud copy when available ---------- */
const LS={get(k){try{return JSON.parse(localStorage.getItem("rt:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("rt:"+k,JSON.stringify(v))}catch(e){}}};
let db=null,uid=null;
const pending={};
async function rget(key){if(!db||!uid)return null;try{const s=await db.doc(`data/users/${uid}/${key}`).get();return s.exists?s.data():null}catch(e){return null}}
function rset(key,obj){if(!db||!uid)return;clearTimeout(pending[key]);pending[key]=setTimeout(async()=>{try{await db.doc(`data/users/${uid}/${key}`).set(JSON.parse(JSON.stringify(obj)));setSync("☁️ 저장됨")}catch(e){setSync("⚠️ 클라우드 저장 실패, 이 기기에만 저장됐어요")}},700)}
function save(key,obj){obj.updatedAt=Date.now();LS.set(key,obj);rset(key,obj)}
const newer=(a,b)=>!a?b:!b?a:((b.updatedAt||0)>(a.updatedAt||0)?b:a);

let today=dkey(new Date());
const savedSet=LS.get("settings");
let S=Object.assign({},DEFAULT_SET,savedSet?{v:0}:{},savedSet||{});
let D=Object.assign(newDay(today),LS.get("day-"+today)||{});
let L=LS.get("log")||{days:{},updatedAt:0};
let openId=null;

function saveSettings(){save("settings",S)}
function saveDay(){
  save("day-"+D.date,D);
  const done=STEPS.filter(s=>D.done[s.id]).length;
  L.days[D.date]=Object.assign({},L.days[D.date],{done,total:STEPS.length,am:AM.every(id=>D.done[id]),focus:Math.round(D.focus.minutes),wake:D.wakeAt,book:D.read.title||"",mode:D.read.mode});
  save("log",L);
}

/* ---------- sound + wake lock ---------- */
let actx=null,wakeLock=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}}
function chime(){if(!actx)return;[0,0.35,0.7].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=[784,988,1175][i];g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+1.4);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+1.5)})}
async function keepAwake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200)}
function setSync(msg){const n=$("#syncNote");if(n)n.textContent=msg}

/* ---------- timers ---------- */
const stepMin=s=>Number(S[s.minKey])||10;
function timerLeft(id){const T=D.timer;if(!T||T.id!==id)return null;return T.endAt?Math.max(0,T.endAt-Date.now()):T.left}
const fmt=ms=>{const s=Math.ceil(ms/1000);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
function startTimer(id,min){unlockAudio();const T=D.timer;
  if(T&&T.id===id&&!T.endAt){T.endAt=Date.now()+T.left;T.left=null}
  else{if(T&&T.id!==id&&T.id==="focus")stopFocus(false);D.timer={id,total:min*60000,endAt:Date.now()+min*60000,left:null}}
  keepAwake(true);saveDay();render()}
function pauseTimer(){const T=D.timer;if(!T||!T.endAt)return;T.left=Math.max(0,T.endAt-Date.now());T.endAt=null;keepAwake(false);saveDay();render()}
function resetTimer(){D.timer=null;keepAwake(false);saveDay();render()}
function finishTimer(){const T=D.timer;if(!T)return;D.timer=null;chime();keepAwake(false);
  if(T.id==="focus"){addFocus(T.total);toast("🎉 집중 세션 완료! 10분 쉬어가요")}
  else{markDone(T.id,true);toast("🔔 "+STEPS.find(s=>s.id===T.id).title+" 끝!")}
  saveDay();render()}
function addFocus(ms){const m=Math.round(ms/60000);if(m<1)return;D.focus.minutes+=m;D.focus.sessions.push({at:Date.now(),min:m});if(D.focus.minutes>=Number(S.focusGoal||120))D.done.focus=D.done.focus||Date.now()}
function stopFocus(doRender=true){const T=D.timer;if(!T||T.id!=="focus")return;const left=T.endAt?T.endAt-Date.now():T.left;addFocus(T.total-left);D.timer=null;keepAwake(false);saveDay();if(doRender){toast("📝 집중 시간 기록했어요");render()}}
setInterval(()=>{const T=D.timer;if(!T)return;const left=timerLeft(T.id);document.querySelectorAll(`[data-clock="${T.id}"]`).forEach(el=>el.textContent=fmt(left));if(T.endAt&&left<=0)finishTimer()},500);

/* ---------- actions ---------- */
function markDone(id,v){if(v)D.done[id]=D.done[id]||Date.now();else delete D.done[id];
  if(v&&openId===id){const nx=STEPS.find(s=>!D.done[s.id]);openId=nx?nx.id:null}}
function toggle(id){const v=!D.done[id];markDone(id,v);if(v)celebrate(id);saveDay();render()}
function celebrate(id){const s=STEPS.find(x=>x.id===id);const n=STEPS.filter(x=>D.done[x.id]).length;
  if(AM.every(k=>D.done[k])&&AM.includes(id))toast("🌞 아침 루틴 완주! 점심 맛있게 🍚");else toast(`${s.emoji} 완료! (${n}/${STEPS.length})`)}

/* ---------- rendering ---------- */
function stepBody(s){
  const doneBtn=(label)=>`<div class="row"><button class="btn primary" data-act="done" data-id="${s.id}">${D.done[s.id]?"↩︎ 체크 해제":label}</button></div>`;
  const timerBlock=(min,extra="")=>{const T=D.timer,mine=T&&T.id===s.id,run=mine&&T.endAt;const left=mine?timerLeft(s.id):min*60000;
    return `<div class="timer"><div class="clock ${run?"run":""}" data-clock="${s.id}">${fmt(left)}</div><div class="row">
      ${run?`<button class="btn" data-act="pause">⏸ 일시정지</button>`:`<button class="btn primary" data-act="start" data-id="${s.id}" data-min="${min}">▶︎ ${mine?"계속":"시작"}</button>`}

    case "diary":{return `<div class="callout pink"><span class="ic">📔</span><div>꼬박일기 앱에서 오늘 일기를 쓰고 돌아와서 체크해요.</div></div>

    case "meditate":return `<div class="callout purple"><span class="ic">🧘</span><div>명상 영상을 켜고, 타이머도 같이 시작해요. 끝나면 종이 울려요.</div></div>${S.meditateUrl?`<div class="row"><a class="btn" href="${esc(S.meditateUrl)}" target="_blank" rel="noopener">▶️ 명상 영상 켜기 (유튜브)</a></div>`:""}`+timerBlock(stepMin(s),`<button class="btn ghost" data-act="done" data-id="${s.id}">${D.done[s.id]?"↩︎ 해제":"타이머 없이 완료"}</button>`);

          <button class="btn chip" data-act="mode" data-mode="paper" aria-pressed="${r.mode==="paper"}">📖 종이책</button>
          <button class="btn chip" data-act="mode" data-mode="yes24" aria-pressed="${r.mode==="yes24"}">📱 YES24 앱</button>
          ${r.mode==="yes24"?scBtn(S.yes24Sc,"📲 YES24 열기"):""}</div></div>
        <div class="fields"><label><div class="label">📕 책 제목</div><input type="text" id="f-title" data-bind="read.title" value="${esc(r.title)}" placeholder="읽고 있는 책"></label>
          <label><div class="label">🔖 읽은 만큼</div><input type="text" id="f-progress" data-bind="read.progress" value="${esc(r.progress)}" placeholder="예: 45→82쪽, 37%"></label></div>
        ${timerBlock(stepMin(s),`<button class="btn ghost" data-act="done" data-id="${s.id}">${D.done[s.id]?"↩︎ 해제":"타이머 없이 완료"}</button>`)}
        <div><div class="memo-tools">
            <span class="label" style="margin:0 6px 0 0">🖊 독서 메모</span>
            <button class="btn tool" data-act="tool" data-tool="pen" aria-pressed="${pen.tool==="pen"}">✏️ 펜</button>
            <button class="btn tool" data-act="tool" data-tool="eraser" aria-pressed="${pen.tool==="eraser"}">🩹 지우개</button>
            ${INKS.map(c=>`<button class="swatch" data-act="ink" data-ink="${c}" style="background:${c}" aria-label="펜 색" aria-pressed="${pen.ink===c&&pen.tool==="pen"}"></button>`).join("")}

        </div>`}
    case "focus":{const goal=Number(S.focusGoal)||120,m=D.focus.minutes,pct=Math.min(100,m/goal*100);const T=D.timer,mine=T&&T.id==="focus",run=mine&&T.endAt;
      return `<div class="callout blue"><span class="ic">🎯</span><div>언제든 원할 때 시작해요. 알림은 끄고, 한 가지 일만.</div></div>
        <label><div class="label">오늘 가장 중요한 일 1가지</div><input type="text" id="f-task" data-bind="focus.task" value="${esc(D.focus.task)}" placeholder="예: 수출 제안서 초안 완성"></label>
        <div class="focus-bar"><div class="bar"><i style="width:${pct}%"></i></div><span class="focus-num">${Math.floor(m/60)}시간 ${m%60}분 / ${Math.floor(goal/60)}시간${goal%60?" "+goal%60+"분":""}</span></div>
        ${mine?`<div class="timer"><div class="clock ${run?"run":""}" data-clock="focus">${fmt(timerLeft("focus"))}</div><div class="row">
            ${run?`<button class="btn" data-act="pause">⏸ 일시정지</button>`:`<button class="btn primary" data-act="start" data-id="focus" data-min="0">▶︎ 계속</button>`}
            <button class="btn" data-act="stopFocus">⏹ 여기까지 기록</button></div></div>`
          :`<div class="row"><button class="btn primary" data-act="start" data-id="focus" data-min="50">▶︎ 50분 집중</button><button class="btn" data-act="start" data-id="focus" data-min="25">▶︎ 25분 집중</button></div>`}
        ${D.focus.sessions.length?`<div class="sessions">${D.focus.sessions.map(x=>`<span class="pill">⏱ ${hm(x.at)} · ${x.min}분</span>`).join("")}</div>`:""}`}
  }
}
function stepMeta(s){
  if(D.done[s.id])return "✓ "+hm(D.done[s.id]);
  if(s.minKey)return "";
  if(s.id==="focus")return `${D.focus.minutes}/${S.focusGoal}분`;
  return "";
}
function renderStep(s){const o=openId===s.id,d=!!D.done[s.id];
  return `<div class="step ${o?"open":""} ${d?"done":""}"><div class="step-head" data-act="open" data-id="${s.id}">
    <button class="chk" data-act="done" data-id="${s.id}" aria-label="${s.title} ${d?"완료 취소":"완료"}">${CHECK}</button>
    <span class="step-emoji" aria-hidden="true">${s.emoji}</span><span class="step-title">${s.title}${s.minKey?" "+stepMin(s)+"분"+(s.suffix?" "+s.suffix:""):""}</span>
    <span class="step-meta">${stepMeta(s)}</span><span class="chev" aria-hidden="true">▶</span></div>
    ${o?`<div class="step-body">${stepBody(s)}</div>`:""}</div>`}
function render(){
  const now=new Date();
  $("#dateLine").textContent=now.toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
  const n=STEPS.filter(s=>D.done[s.id]).length;
  const st=streak();
  $("#props").innerHTML=`
    <dt>⏰ 기상</dt><dd><span class="pill">목표 ${esc(S.wake)}</span>${D.wakeAt?`<span class="pill">☀️ ${hm(D.wakeAt)} 기상</span>`:`<button class="btn" data-act="wake">☀️ 일어났어요</button>`}</dd>
    <dt>✅ 오늘</dt><dd><div class="bar"><i style="width:${n/STEPS.length*100}%"></i></div><span class="hand" style="font-size:20px;font-weight:700">${n} / ${STEPS.length}</span></dd>
    <dt>🔥 연속</dt><dd><span class="hand" style="font-size:20px;font-weight:700">${st}일째</span><span class="muted">아침 루틴 6개를 다 하면 1일</span></dd>`;
  const sec=(title,sub,ids)=>`<h2>${title}${sub?` <small>${sub}</small>`:""}</h2><div class="steps">${STEPS.filter(s=>ids.includes(s.sec)).map(renderStep).join("")}</div>`;
  $("#main").innerHTML=sec("🌅 아침 루틴",`${esc(S.wake)} 기상부터`,["am"])+sec("🌤 점심","",["noon"])+sec("💼 업무","하루 "+(S.focusGoal||120)+"분 집중",["work"])+sec("🌙 저녁","",["eve"]);
  const slot=$("#memoSlot");if(slot){slot.appendChild(cv);if(!hasInk)slot.insertAdjacentHTML("beforeend",'<span class="hint">여기에 애플펜슬로 메모해요 ✍️</span>');sizeCanvas()}
  renderStats();
}
function streak(){let c=0;const d=new Date();if(!(L.days[dkey(d)]||{}).am)d.setDate(d.getDate()-1);
  while((L.days[dkey(d)]||{}).am){c++;d.setDate(d.getDate()-1)}return c}
function renderStats(){
  const t=new Date();t.setHours(0,0,0,0);const start=new Date(t);start.setDate(t.getDate()-28-t.getDay());
  let cells="";["일","월","화","수","목","금","토"].forEach(w=>cells+=`<div class="dow">${w}</div>`);
  for(let d=new Date(start);d<=t||d.getDay()!==0;d.setDate(d.getDate()+1)){
    if(d>t){cells+=`<div class="c empty"></div>`;continue}
    const k=dkey(d),x=L.days[k];const r=x?x.done/x.total:0;const lv=!x||!x.done?0:r<.3?1:r<.6?2:r<1?3:4;
    cells+=`<div class="c l${lv} ${k===today?"today":""}" title="${k} · ${x?x.done:0}/${STEPS.length}">${d.getDate()}</div>`}
  const week=[...Array(7)].map((_,i)=>{const d=new Date(t);d.setDate(t.getDate()-i);return L.days[dkey(d)]}).filter(Boolean);
  const fMin=week.reduce((a,x)=>a+(x.focus||0),0),amDays=week.filter(x=>x.am).length;
  $("#stats").innerHTML=`<div><div class="heat">${cells}</div><div class="legend">덜 함 <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> 다 함</div></div>
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="callout green" style="margin:0"><span class="ic">🌞</span><div><div class="label">최근 7일 아침 루틴 완주</div><div class="hand" style="font-size:28px;font-weight:700">${amDays} / 7일</div></div></div>
      <div class="callout blue" style="margin:0"><span class="ic">🎯</span><div><div class="label">최근 7일 집중 시간</div><div class="hand" style="font-size:28px;font-weight:700">${Math.floor(fMin/60)}시간 ${fMin%60}분</div></div></div>
    </div>`;
}

/* ---------- handwriting canvas ---------- */
const INKS=["#2b2a27","#2a5fb0","#c0453c"];
const pen={tool:"pen",ink:INKS[0]};
const cv=document.createElement("canvas");const cx=cv.getContext("2d");
let hasInk=false,penSeen=false,drawing=false,last=null,memoLoadedFor=null;
function sizeCanvas(){const w=cv.parentElement?cv.parentElement.clientWidth:0;if(!w)return;const dpr=Math.min(2,window.devicePixelRatio||1);const W=Math.round(w*dpr),H=Math.round(380*dpr);
  if(cv.width===W&&cv.height===H)return;let old=null;if(cv.width&&hasInk){old=document.createElement("canvas");old.width=cv.width;old.height=cv.height;old.getContext("2d").drawImage(cv,0,0)}
  cv.width=W;cv.height=H;if(old)cx.drawImage(old,0,0,old.width*(W/old.width),old.height*(W/old.width));
  if(memoLoadedFor!==D.date)loadMemo()}
function pt(e){const r=cv.getBoundingClientRect();const k=cv.width/r.width;return{x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,p:e.pointerType==="pen"?(e.pressure||0.5):0.5}}
function stroke(a,b){const k=cv.width/cv.getBoundingClientRect().width;cx.lineCap="round";cx.lineJoin="round";
  if(pen.tool==="eraser"){cx.globalCompositeOperation="destination-out";cx.lineWidth=22*k}else{cx.globalCompositeOperation="source-over";cx.strokeStyle=pen.ink;cx.lineWidth=(1.2+b.p*2.6)*k}
  cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="pen")penSeen=true;if(e.pointerType==="touch"&&penSeen)return;
  e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pt(e);stroke(last,last);if(!hasInk){hasInk=true;const h=cv.parentElement.querySelector(".hint");if(h)h.remove()}});
cv.addEventListener("pointermove",e=>{if(!drawing)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=pt(ev);stroke(last,p);last=p}});
const endStroke=()=>{if(!drawing)return;drawing=false;queueMemoSave()};
cv.addEventListener("pointerup",endStroke);cv.addEventListener("pointercancel",endStroke);
let memoT;function queueMemoSave(){const s=$("#memoState");if(s)s.textContent="저장 중…";clearTimeout(memoT);memoT=setTimeout(saveMemo,1200)}
function exportMemo(){let url=cv.toDataURL("image/png");if(url.length<240000)return url;
  const c=document.createElement("canvas");const sc=Math.min(1,1100/cv.width);c.width=cv.width*sc;c.height=cv.height*sc;const g=c.getContext("2d");g.fillStyle="#fffdf6";g.fillRect(0,0,c.width,c.height);g.drawImage(cv,0,0,c.width,c.height);
  for(const q of [0.7,0.5,0.35]){url=c.toDataURL("image/jpeg",q);if(url.length<240000)break}return url}
function saveMemo(){const img=hasInk?exportMemo():"";const rec={date:D.date,img};save("memo-"+D.date,rec);
  L.days[D.date]=Object.assign({},L.days[D.date]||{done:0,total:STEPS.length},{memo:!!img});save("log",L);const s=$("#memoState");if(s)s.textContent="✓ 저장됨"}
function drawMemo(rec){cx.globalCompositeOperation="source-over";cx.clearRect(0,0,cv.width,cv.height);hasInk=false;
  if(rec&&rec.img){const im=new Image();im.onload=()=>{cx.drawImage(im,0,0,cv.width,cv.width*im.height/im.width);hasInk=true;const h=cv.parentElement&&cv.parentElement.querySelector(".hint");if(h)h.remove()};im.src=rec.img}}
async function loadMemo(){memoLoadedFor=D.date;const loc=LS.get("memo-"+D.date);drawMemo(loc);const rem=await rget("memo-"+D.date);if(rem&&newer(loc,rem)===rem&&rem!==loc){LS.set("memo-"+D.date,rem);drawMemo(rem)}}
let clearArm=0;

/* ---------- events ---------- */
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==="open"){openId=openId===id?null:id;render();return}
  e.preventDefault();e.stopPropagation();
  switch(a){
    case "done":toggle(id);break;
    case "start":startTimer(id,Number(el.dataset.min));break;
    case "pause":pauseTimer();break;
    case "reset":resetTimer();break;
    case "stopFocus":stopFocus();break;
    case "wake":unlockAudio();D.wakeAt=Date.now();saveDay();toast("☀️ 좋은 아침! 드림보드 루틴부터 시작해요");render();break;
    case "mode":D.read.mode=el.dataset.mode;saveDay();render();break;
    case "tool":pen.tool=el.dataset.tool;render();break;
    case "ink":pen.tool="pen";pen.ink=el.dataset.ink;render();break;
    case "clear":if(Date.now()-clearArm<3000){clearArm=0;cx.clearRect(0,0,cv.width,cv.height);hasInk=false;saveMemo();render()}else{clearArm=Date.now();el.textContent="한 번 더 누르면 다 지워져요";setTimeout(()=>{if(el.isConnected)el.textContent="🗑 전체 지우기"},3000)}break;
    case "openSettings":$("#settingsBox").open=true;$("#settingsBox").scrollIntoView({behavior:"smooth"});break;
  }});
document.addEventListener("input",e=>{const b=e.target.dataset.bind,s=e.target.dataset.set;
  if(b){const [o,k]=b.split(".");D[o][k]=e.target.value;saveDay()}
  if(s){S[s]=e.target.type==="number"?Number(e.target.value):e.target.value;saveSettings()}});
document.addEventListener("change",async e=>{if(e.target.id==="pastMemo"){const k=e.target.value,v=$("#pastView");if(!k){v.innerHTML="";return}
  const rec=newer(LS.get("memo-"+k),await rget("memo-"+k));const x=L.days[k]||{};
  v.innerHTML=rec&&rec.img?`<div class="muted" style="margin:8px 0 4px">${k} · ${x.mode==="yes24"?"📱 YES24":x.mode==="paper"?"📖 종이책":""} ${esc(x.book||"")}</div><div class="paper"><img src="${rec.img}" alt="${k} 독서 메모"></div>`:'<p class="muted">이 날의 메모를 찾지 못했어요.</p>'}
  if(e.target.dataset.set)render()});
function fillSettings(){Object.keys(DEFAULT_SET).forEach(k=>{const i=document.getElementById("s-"+k);if(i)i.value=S[k]??""})}
window.addEventListener("resize",()=>sizeCanvas());
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkDay();if(D.timer&&D.timer.endAt)keepAwake(true)}});
function checkDay(){const k=dkey(new Date());if(k!==today){today=k;D=Object.assign(newDay(k),LS.get("day-"+k)||{});openId=(STEPS.find(s=>!D.done[s.id])||{}).id||null;memoLoadedFor=null;render();syncDay()}}
setInterval(checkDay,60000);

/* ---------- cloud sync ---------- */
async function syncDay(){const r=await rget("day-"+today);if(r&&newer(D,r)===r&&r!==D){D=Object.assign(newDay(today),r);LS.set("day-"+today,D);render()}else if(D.updatedAt)rset("day-"+today,D)}
async function connect(){
  if(!window.claude||!window.claude.use){setSync("📱 기록은 이 기기에만 저장돼요. 가끔 💾 백업 파일을 저장해 두세요.");return}
  try{const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!d||!u){setSync("📱 이 기기(브라우저)에 저장 중이에요. 로그인하면 내 계정에도 안전하게 보관돼요.");return}
    const id=await u.id();if(!id){setSync("📱 이 기기에 저장 중이에요.");return}db=d;uid=id;
    const [rs,rl]=await Promise.all([rget("settings"),rget("log")]);
    if(rs&&newer(S,rs)===rs){S=Object.assign({},DEFAULT_SET,{v:0},rs);LS.set("settings",S);migrate();fillSettings()}else if(S.updatedAt)rset("settings",S);
    if(rl){const m={days:Object.assign({},rl.days,L.days),updatedAt:Math.max(rl.updatedAt||0,L.updatedAt||0)};Object.keys(rl.days).forEach(k=>{if(!L.days[k])m.days[k]=rl.days[k]});L=m;LS.set("log",L);if(JSON.stringify(rl.days)!==JSON.stringify(L.days))rset("log",L)}else if(L.updatedAt)rset("log",L);
    await syncDay();memoLoadedFor=null;sizeCanvas();if(memoLoadedFor!==D.date&&cv.width)loadMemo();
    setSync("☁️ 내 계정에 비공개로 저장돼요. 나만 볼 수 있어요.");render();
  }catch(e){setSync("📱 이 기기에 저장 중이에요.")}
}

openId=(STEPS.find(s=>!D.done[s.id])||{}).id||null;
migrate();fillSettings();render();connect();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
$("#exportBtn").addEventListener("click",()=>{const out={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("rt:"))out[k]=localStorage.getItem(k)}}catch(e){}
  const blob=new Blob([JSON.stringify({app:"routine",v:1,at:Date.now(),data:out})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`루틴백업-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("💾 백업 파일을 만들었어요")});
$("#importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=="routine")throw 0;Object.entries(j.data).forEach(([k,v])=>localStorage.setItem(k,v));toast("📥 불러왔어요! 새로고침할게요");setTimeout(()=>location.reload(),900)}catch(err){toast("⚠️ 루틴 백업 파일이 아니에요")}e.target.value=""});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>

</body>
</html>
